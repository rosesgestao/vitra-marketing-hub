<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitra — Central Operacional</title>
    <meta name="theme-color" content="#0A1628" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='50' fill='%230A1628'/%3E%3Cpolygon points='20,33 34,33 27,50' fill='%238EC4F0'/%3E%3Cpolygon points='20,33 27,50 50,72' fill='%231B3A6B'/%3E%3Cpolygon points='34,33 27,50 50,72' fill='%232E6BB5'/%3E%3Cpolygon points='80,33 66,33 73,50' fill='%23F0C95C'/%3E%3Cpolygon points='80,33 73,50 50,72' fill='%239B7A1C'/%3E%3Cpolygon points='66,33 73,50 50,72' fill='%23D4A84A'/%3E%3C/svg%3E" />
    <!-- Define a marca (tema) ANTES do primeiro paint para evitar flash de navy ao restaurar um painel
         Premium do localStorage. Padrao = marca-mae (Imobiliaria/navy); so views Premium pintam preto. -->
    <script>
      try {
        var v = localStorage.getItem('vitra-operational-dashboard.active-view');
        document.documentElement.dataset.brand =
          (v === 'premium' || v === 'premium-trafego') ? 'vitra_premium' : 'vitra_imobiliaria';
      } catch (e) {
        document.documentElement.dataset.brand = 'vitra_imobiliaria';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
