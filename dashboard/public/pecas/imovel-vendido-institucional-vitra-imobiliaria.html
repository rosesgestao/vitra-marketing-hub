<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VITRA IMOBILIÁRIA — Institucional · Imóvel Vendido (post)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--navy:#0A1628;--navy2:#0F2140;--gold:#C4942A;--gold-light:#F0C95C;--white:#FFFFFF;--off:#F5F5F0;
    --font:'Inter',sans-serif;--serif:'Playfair Display',serif}
  body{background:#0c1422;color:#fff;font-family:var(--font);min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px 60px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;max-width:1080px}
  .toolbar .group{display:flex;gap:6px;align-items:center;background:#0f1c30;border:1px solid #20304a;border-radius:12px;padding:6px}
  .toolbar label{font-size:11px;letter-spacing:.4px;color:#9fb0c8;text-transform:uppercase;margin:0 4px}
  button{font-family:var(--font);font-weight:600;font-size:13px;letter-spacing:.3px;border:1px solid #2a3c59;border-radius:9px;padding:9px 12px;background:#11233d;color:var(--off);cursor:pointer;transition:.15s}
  button:hover{border-color:var(--gold)}
  button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
  button.primary{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
  button.primary:hover{background:var(--gold-light)}
  .hint{font-size:12px;color:#8395ac;max-width:1080px;text-align:center;line-height:1.5}
  .status{font-size:12px;color:var(--gold-light);min-height:16px;text-align:center}

  .frame{transform:scale(.40);transform-origin:top center;margin-bottom:-60%}
  body.exporting .frame{transform:none;margin:0}
  .stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--navy);font-family:var(--font);color:#fff}
  .stage.story{height:1920px}.stage.post{height:1080px}

  /* fundo: empreendimento já borrado (rasterizado no canvas) ou gradiente navy padrão */
  .bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0;
      background-image:radial-gradient(120% 80% at 50% 18%, #16314f 0%, #0A1628 56%, #07111F 100%)}
  .scrim{position:absolute;inset:0;z-index:1;background:
      linear-gradient(180deg, rgba(7,17,31,.78) 0%, rgba(7,17,31,.42) 34%, rgba(7,17,31,.40) 60%, rgba(7,17,31,.92) 100%)}
  /* brilho dourado premium (topo e base) — identidade Vitra, sem copiar a referência */
  .glow{position:absolute;inset:0;z-index:1;pointer-events:none;background:
      radial-gradient(85% 42% at 50% -6%, rgba(196,148,42,.34), transparent 60%),
      radial-gradient(95% 40% at 50% 106%, rgba(196,148,42,.30), transparent 62%)}
  .ribbon{position:absolute;top:0;left:0;right:0;height:6px;background:var(--gold);opacity:.85;z-index:4}

  /* foto do corretor (frente), ancorada na base, atrás dos textos do topo e atrás da logo */
  .person{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;height:58%;z-index:2;
      background-repeat:no-repeat;background-position:center bottom;background-size:contain}
  .stage.story .person{height:55%}.stage.post .person{height:52%}

  /* bloco de texto no topo */
  .content{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;padding:96px 70px 0}
  .stage.story .content{padding-top:250px}.stage.post .content{padding-top:64px}
  .vendido{font-weight:800;font-size:168px;line-height:.92;letter-spacing:1px;color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.45)}
  .stage.story .vendido{font-size:188px}.stage.post .vendido{font-size:132px}
  .por{font-size:44px;font-weight:400;color:rgba(255,255,255,.92);margin-top:16px}
  .stage.post .por{font-size:34px;margin-top:10px}
  .nome{font-family:var(--serif);font-style:italic;font-weight:600;font-size:62px;color:#fff;margin-top:2px}
  .stage.post .nome{font-size:50px}
  .emp{margin-top:24px;background:var(--gold);color:var(--navy);font-weight:700;font-size:38px;letter-spacing:.3px;
      padding:12px 36px;border-radius:44px;box-shadow:0 8px 30px rgba(196,148,42,.28)}
  .stage.post .emp{font-size:32px;padding:10px 30px;margin-top:18px}

  /* logo na base, à frente da foto do corretor */
  .logo-wrap{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:5}
  .stage.story .logo-wrap{bottom:120px}.stage.post .logo-wrap{bottom:30px}
  .logo{width:300px;height:auto}.stage.post .logo{width:250px;height:auto}

  [contenteditable]{outline:none}[contenteditable]:focus{box-shadow:0 0 0 2px rgba(240,201,92,.5);border-radius:8px}
</style>
</head>

  <div class="toolbar">
    <div class="group"><label>Formato</label>
      <button id="b-feed" class="on" onclick="setFmt('feed')">Feed 4:5</button>

      <button id="b-post" onclick="setFmt('post')">WhatsApp 1:1</button></div>

    <div class="group"><label>Corretor (frente)</label>

  let empImg=null;            // imagem original do empreendimento (p/ reborrar ao trocar formato)
  const DEFAULT_BG="radial-gradient(120% 80% at 50% 18%, #16314f 0%, #0A1628 56%, #07111F 100%)";

  function setFmt(f){fmt=f;stage.classList.remove('feed','story','post');stage.classList.add(f);
    ['feed','story','post'].forEach(k=>document.getElementById('b-'+k).classList.toggle('on',k===f));
    document.querySelector('.frame').style.transform='scale('+(f==='story'?0.34:0.40)+')';
    if(empImg)blurBg();}

  // (8) fundo com blur: borra a imagem do empreendimento num canvas e usa o resultado como background.
  function blurBg(){const [W,H]=DIMS[fmt];const c=document.createElement('canvas');c.width=W;c.height=H;
    const x=c.getContext('2d');const s=Math.max(W/empImg.width,H/empImg.height);
    const dw=empImg.width*s,dh=empImg.height*s,ox=(W-dw)/2,oy=(H-dh)/2,pad=40;
    x.filter='blur(13px)';x.drawImage(empImg,ox-pad,oy-pad,dw+pad*2,dh+pad*2);x.filter='none';
    bgEl.style.backgroundImage="url('"+c.toDataURL('image/jpeg',0.9)+"')";}
  function loadEmp(ev){const file=ev.target.files&&ev.target.files[0];if(!file)return;
    const img=new Image();img.onload=()=>{empImg=img;blurBg();
      document.getElementById('status').textContent='Fundo do empreendimento aplicado (blur).';};
    img.src=URL.createObjectURL(file);}
  function clearEmp(){empImg=null;bgEl.style.backgroundImage=DEFAULT_BG;document.getElementById('status').textContent='';}

  // (6) foto do corretor à frente, ancorada na base.
  function loadPerson(ev){const file=ev.target.files&&ev.target.files[0];if(!file)return;
    personEl.style.backgroundImage="url('"+URL.createObjectURL(file)+"')";
    document.getElementById('status').textContent='Foto do corretor aplicada.';}
  function clearPerson(){personEl.style.backgroundImage='none';}

  async function exportPeca(){const status=document.getElementById('status');status.textContent='Gerando PNG…';
    const frame=document.querySelector('.frame');const pT=frame.style.transform,pM=frame.style.marginBottom;
    document.body.classList.add('exporting');frame.style.transform='none';frame.style.marginBottom='0';
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    try{const canvas=await html2canvas(stage,{backgroundColor:'#0A1628',scale:1,useCORS:true,logging:false});
      const a=document.createElement('a');a.download='vitra-imobiliaria-imovel-vendido-'+fmt+'-'+canvas.width+'x'+canvas.height+'.png';
      a.href=canvas.toDataURL('image/png');a.click();status.textContent='PNG '+canvas.width+'×'+canvas.height+' baixado ✓';}
    catch(e){status.textContent='Erro ao gerar: '+e.message;}
    finally{document.body.classList.remove('exporting');frame.style.transform=pT;frame.style.marginBottom=pM;}}
  setFmt('feed');
</script>
</body>
</html>
