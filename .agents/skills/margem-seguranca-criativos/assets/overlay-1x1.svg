<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- Overlay de safe zone — Feed Quadrado 1:1 (1080x1080). Margem 108px (10%) em cada lado.
       Sobreponha a 100% sobre o criativo: conteudo critico deve ficar na area transparente. -->
  <g fill="#EF4444" fill-opacity="0.45">
    <rect x="0" y="0" width="1080" height="108"/>
    <rect x="0" y="972" width="1080" height="108"/>
    <rect x="0" y="108" width="108" height="864"/>
    <rect x="972" y="108" width="108" height="864"/>
  </g>
  <rect x="108" y="108" width="864" height="864" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14 10"/>
  <g fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="540" y="62" font-size="34">108px</text>
    <text x="540" y="1038" font-size="34">108px</text>
    <text x="540" y="552" font-size="40" fill-opacity="0.92">SAFE ZONE 864 x 864</text>
  </g>
</svg>
