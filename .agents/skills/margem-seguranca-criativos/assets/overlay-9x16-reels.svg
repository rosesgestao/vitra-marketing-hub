<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- Overlay de safe zone — Reels 9:16 (1080x1920). Topo 250px (13%), base 450px (23.4%),
       laterais 35px (3.2%) + coluna de acoes a direita (~120px, dos ~2/3 inferiores para baixo).
       Mais restritivo que Stories: projete o 9:16 para ESTE overlay. -->
  <g fill="#EF4444" fill-opacity="0.45">
    <rect x="0" y="0" width="1080" height="250"/>
    <rect x="0" y="1470" width="1080" height="450"/>
    <rect x="0" y="250" width="35" height="1220"/>
    <rect x="1045" y="250" width="35" height="1220"/>
  </g>
  <!-- Coluna de acoes do Reels (curtir/comentar/compartilhar/audio) -->
  <rect x="925" y="1280" width="120" height="190" fill="#EF4444" fill-opacity="0.45"/>
  <rect x="35" y="250" width="1010" height="1220" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14 10"/>
  <g fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="540" y="135" font-size="40">TOPO 250px (UI do app)</text>
    <text x="540" y="1710" font-size="40">BASE 450px (legenda + CTA + audio)</text>
    <text x="985" y="1385" font-size="22">acoes</text>
    <text x="540" y="860" font-size="44" fill-opacity="0.92">SAFE ZONE 1010 x 1220</text>
  </g>
</svg>
